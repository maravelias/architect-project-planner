jmix.core.available-locales=en

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

logging.level.org.atmosphere=warn

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

#OpenID
logging.level.io.jmix.oidc=DEBUG

# https://github.com/jmix-framework/jmix/tree/master/jmix-oidc
jmix.oidc.use-default-configuration=true
jmix.oidc.default-claims-roles-mapper.roles-claim-names=realm_access.roles,resource_access.archplan-backend.roles,roles
spring.security.oauth2.client.registration.keycloak.client-id=archplan-backend
spring.security.oauth2.client.registration.keycloak.client-secret=changeme-in-prod
spring.security.oauth2.client.registration.keycloak.scope=openid, profile, email
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://192.168.57.10:5080/realms/archplan
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://192.168.57.10:5080/realms/archplan
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username